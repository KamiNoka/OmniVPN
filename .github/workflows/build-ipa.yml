name: Build iOS IPA (OmniVPN)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Full IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install Tools
        run: |
          brew install xcodegen

      - name: Download Full Sing-box Libbox Framework
        run: |
          chmod +x scripts/download_libbox.sh
          ./scripts/download_libbox.sh

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Archive
        run: |
          mkdir -p build
          xcodebuild -project VpnClient.xcodeproj \
            -scheme VpnClient \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/VpnClient.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive

      - name: Package Full IPA
        run: |
          mkdir -p build/out
          mkdir -p build/Payload
          cp -R "build/VpnClient.xcarchive/Products/Applications/VpnClient.app" build/Payload/
          cd build
          zip -qr out/OmniVPN.ipa Payload
          cd ..
          echo "==> Готовый полнофункциональный IPA файл:"
          ls -lh build/out/OmniVPN.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniVPN-IPA
          path: build/out/OmniVPN.ipa
          retention-days: 14

      - name: Update GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 build/out/OmniVPN.ipa --clobber || echo "Release upload fallback"
