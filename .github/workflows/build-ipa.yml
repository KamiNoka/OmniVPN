name: Build iOS IPA (OmniVPN)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install Tools
        run: |
          brew install xcodegen

      - name: Download Sing-box Libbox Framework
        run: |
          chmod +x scripts/download_libbox.sh
          ./scripts/download_libbox.sh

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Install Apple Certificate & Provisioning Profiles (if configured)
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_APP_BASE64: ${{ secrets.PROVISION_PROFILE_APP_BASE64 }}
          PROVISION_PROFILE_EXT_BASE64: ${{ secrets.PROVISION_PROFILE_EXT_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary123' }}
        run: |
          # 1. Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 2. Import certificate to keychain
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERT_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # 3. Import provisioning profiles
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          if [ -n "$PROVISION_PROFILE_APP_BASE64" ]; then
            echo "$PROVISION_PROFILE_APP_BASE64" | base64 --decode > "$PROFILES_DIR/app.mobileprovision"
          fi

          if [ -n "$PROVISION_PROFILE_EXT_BASE64" ]; then
            echo "$PROVISION_PROFILE_EXT_BASE64" | base64 --decode > "$PROFILES_DIR/ext.mobileprovision"
          fi

          echo "✓ Сертификаты и профили успешно установлены"

      - name: Build Archive
        run: |
          mkdir -p build
          if [ -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" ]; then
            xcodebuild -project VpnClient.xcodeproj \
              -scheme VpnClient \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/VpnClient.xcarchive \
              clean archive
          else
            echo "ℹ️ Секреты подписи не обнаружены, сборка без подписи (для TrollStore / AltStore)..."
            xcodebuild -project VpnClient.xcodeproj \
              -scheme VpnClient \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/VpnClient.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              clean archive
          fi

      - name: Package IPA
        run: |
          mkdir -p build/out
          if [ -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" ]; then
            xcodebuild -exportArchive \
              -archivePath build/VpnClient.xcarchive \
              -exportOptionsPlist exportOptions.plist \
              -exportPath build/out
          else
            # Manual packaging into unsigned IPA payload
            echo "==> Упаковка Payload в OmniVPN-unsigned.ipa..."
            mkdir -p build/Payload
            cp -R "build/VpnClient.xcarchive/Products/Applications/VpnClient.app" build/Payload/
            cd build
            zip -qr out/OmniVPN.ipa Payload
            cd ..
          fi

          echo "==> Содержимое директории out:"
          ls -lh build/out

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniVPN-IPA
          path: build/out/*.ipa
          retention-days: 14

      - name: Create GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/out/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
