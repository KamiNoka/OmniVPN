name: VpnClient
options:
  bundleIdPrefix: com.universal.vpnclient
  deploymentTarget:
    iOS: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  VpnClient:
    type: application
    platform: iOS
    sources:
      - path: VpnClient
    entitlements:
      path: VpnClient/VpnClient.entitlements
    dependencies:
      - target: PacketTunnel
      - framework: Frameworks/Libbox.xcframework
        embed: true
      - sdk: UIKit.framework
      - sdk: NetworkExtension.framework
      - sdk: SystemConfiguration.framework
    info:
      path: VpnClient/Resources/Info.plist
      properties:
        CFBundleDisplayName: "OmniVPN"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: "LaunchScreen"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Необходим доступ к камере для сканирования QR-кодов подписок и серверов."
        NSLocalNetworkUsageDescription: "Необходим доступ к локальной сети для проверки пинга серверов и раздельного туннелирования."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.universal.vpnclient
        ENABLE_BITCODE: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        SWIFT_OPTIMIZATION_LEVEL: "-O"

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: VpnClient/Models
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
    dependencies:
      - framework: Frameworks/Libbox.xcframework
        embed: false
      - sdk: UIKit.framework
      - sdk: NetworkExtension.framework
      - sdk: SystemConfiguration.framework
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: "PacketTunnel"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: "com.apple.networkextension.packet-tunnel"
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.universal.vpnclient.PacketTunnel
        ENABLE_BITCODE: "NO"
        APPLICATION_EXTENSION_API_ONLY: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        OTHER_LDFLAGS:
          - "-framework"
          - "UIKit"
          - "-framework"
          - "NetworkExtension"
          - "-framework"
          - "SystemConfiguration"
          - "-lc++"
